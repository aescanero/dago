version: "2"

run:
  timeout: 5m
  go: "1.25"

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/aescanero/dago

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - misspell
    - gocognit
    - funlen
    - gocritic
    - noctx
    - wrapcheck
    - exhaustive
    - revive

  settings:
    funlen:
      lines: 80
      statements: 50
    gocognit:
      min-complexity: 15
    wrapcheck:
      ignoreSigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
    revive:
      rules:
        - name: exported
        - name: var-naming
        - name: error-return
        - name: error-naming

  exclusions:
    paths:
      - dashboard/node_modules
    rules:
      - path: "_test\\.go"
        linters:
          - funlen
          - wrapcheck
          - exhaustive
          - errcheck
          - noctx
      - source: "defer client\\.Close"
        linters:
          - errcheck
      - path: "libs/utils"
        linters:
          - revive
