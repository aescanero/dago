TokenRequest:
  type: object
  required:
    - grant_type
    - code
    - code_verifier
    - redirect_uri
    - client_id
  properties:
    grant_type:
      type: string
      enum: [authorization_code]
      description: Must be "authorization_code"
    code:
      type: string
      description: Authorization code received from the /authorize endpoint
    code_verifier:
      type: string
      minLength: 43
      maxLength: 128
      description: Original PKCE code verifier (RFC 7636)
    redirect_uri:
      type: string
      format: uri
      description: Must match the redirect_uri used in /authorize
    client_id:
      type: string
      description: OAuth client identifier

AuthorizeParams:
  type: object
  required:
    - email
    - password
    - code_challenge
    - redirect_uri
    - client_id
  properties:
    email:
      type: string
      format: email
    password:
      type: string
    response_type:
      type: string
      enum: [code]
    client_id:
      type: string
    redirect_uri:
      type: string
      format: uri
    code_challenge:
      type: string
      description: base64url(SHA-256(code_verifier)) per RFC 7636
    code_challenge_method:
      type: string
      enum: [S256]
    state:
      type: string

RegisterInput:
  type: object
  required:
    - email
    - password
  properties:
    email:
      type: string
      format: email
      maxLength: 320
      example: user@example.com
    password:
      type: string
      minLength: 12
      example: securepass123

LoginInput:
  type: object
  required:
    - email
    - password
  properties:
    email:
      type: string
      format: email
      maxLength: 320
      example: user@example.com
    password:
      type: string
      example: securepass123

TokenResponse:
  type: object
  required:
    - access_token
    - token_type
    - expires_in
  properties:
    access_token:
      type: string
      description: JWT RS256 signed access token
    token_type:
      type: string
      enum: [Bearer]
    expires_in:
      type: integer
      description: Token validity in seconds
      example: 3600

UserResponse:
  type: object
  required:
    - id
    - email
    - tags
    - created_at
  properties:
    id:
      type: string
      format: uuid
    email:
      type: string
      format: email
    tags:
      type: array
      items:
        type: string
      default: []
    created_at:
      type: string
      format: date-time

JWKSResponse:
  type: object
  required:
    - keys
  properties:
    keys:
      type: array
      items:
        type: object
        required:
          - kty
          - alg
          - kid
          - n
          - e
        properties:
          kty:
            type: string
            example: RSA
          alg:
            type: string
            example: RS256
          use:
            type: string
            example: sig
          kid:
            type: string
          n:
            type: string
            description: RSA modulus (base64url)
          e:
            type: string
            description: RSA public exponent (base64url)
