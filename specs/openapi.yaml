openapi: 3.1.0
info:
  title: Dago API
  description: |
    API REST del sistema de orquestación de grafos de IA.
    Solo el orchestrator expone esta API al dashboard y clientes externos.
    Los servicios de soporte (auth-server, catalog, mcp-registry, agent-registry)
    exponen sus propias APIs documentadas en ficheros separados.
  version: 1.0.0
  license:
    name: MIT

servers:
  - url: http://localhost:8080/api/v1
    description: Desarrollo local
  - url: https://api.dago.example.com/api/v1
    description: Producción

security:
  - bearerAuth: []

tags:
  - name: graphs
    description: Gestión de grafos
  - name: executions
    description: Ejecución y monitorización de grafos
  - name: nodes
    description: Gestión de nodos
  - name: packages
    description: Catálogo de paquetes (proxy a catalog service)
  - name: auth
    description: Authentication (auth-server)

paths:
  /graphs:
    $ref: './paths/graphs.yaml#/graphs'
  /graphs/{id}:
    $ref: './paths/graphs.yaml#/graphsId'
  /executions:
    $ref: './paths/executions.yaml#/executions'
  /auth/register:
    $ref: './paths/auth.yaml#/register'
  /auth/login:
    $ref: './paths/auth.yaml#/login'
  /.well-known/jwks.json:
    $ref: './paths/auth.yaml#/jwks'
  /authorize:
    $ref: './paths/auth.yaml#/authorize'
  /token:
    $ref: './paths/auth.yaml#/token'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT emitido por auth-server

  schemas:
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Código de error de negocio
          example: GRAPH_NOT_FOUND
        message:
          type: string
          description: Mensaje legible para humanos
          example: Graph with ID 550e8400-... not found
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              reason:
                type: string

    Pagination:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
        total_pages:
          type: integer

    GraphInput:
      $ref: './schemas/graph.yaml#/GraphInput'

    GraphResponse:
      $ref: './schemas/graph.yaml#/GraphResponse'

    GraphListResponse:
      $ref: './schemas/graph.yaml#/GraphListResponse'

    ExecutionInput:
      $ref: './schemas/execution.yaml#/ExecutionInput'

    ExecutionResponse:
      $ref: './schemas/execution.yaml#/ExecutionResponse'

    RegisterInput:
      $ref: './schemas/auth.yaml#/RegisterInput'

    LoginInput:
      $ref: './schemas/auth.yaml#/LoginInput'

    TokenResponse:
      $ref: './schemas/auth.yaml#/TokenResponse'

    UserResponse:
      $ref: './schemas/auth.yaml#/UserResponse'

    JWKSResponse:
      $ref: './schemas/auth.yaml#/JWKSResponse'

    TokenRequest:
      $ref: './schemas/auth.yaml#/TokenRequest'

    AuthorizeParams:
      $ref: './schemas/auth.yaml#/AuthorizeParams'
